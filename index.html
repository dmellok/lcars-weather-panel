<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCARS Weather</title>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:#000;color:#fff;font-family:'Antonio','Bebas Neue',sans-serif;text-transform:uppercase;letter-spacing:.02em}
#app{width:1090px;margin:0 auto;padding:40px 0}
.sec{margin-bottom:30px}
.hd{display:flex;gap:8px;height:44px;margin-bottom:18px}
.hd-t{border-radius:22px 0 0 22px;padding:0 22px 0 30px;font-size:32px;line-height:44px;color:#000;font-weight:700;white-space:nowrap}
.hd-f{flex:1}
.hd-c{border-radius:0 22px 22px 0;padding:0 26px 0 16px;font-size:24px;line-height:44px;color:#000;white-space:nowrap}
.ro{border-left:10px solid #FF8000;padding-left:14px}
.ro .l{font-size:22px;color:#fff;line-height:1.15;white-space:nowrap}
.ro .v{font-size:60px;line-height:1.08;color:#fff;white-space:nowrap}
.ro .v small{font-size:28px;color:#FFFF00;margin-left:6px}
.env{display:flex;gap:30px;height:230px}
.hero{width:430px}
.hero .l{font-size:26px;line-height:1.1}
.hero .v{font-size:200px;line-height:.98;color:#FF8000;font-weight:700;white-space:nowrap}
.hero .v small{font-size:64px;color:#FFFF00;font-weight:400;margin-left:8px}
.grid3{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:22px 18px;align-content:center}
.tr{margin-top:18px}
.cap{display:flex;justify-content:space-between;font-size:24px;line-height:30px}
.cap em{font-style:normal;color:#FFFF00}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px}
.bars i{flex:1;border-radius:8px;background:#FF8000;min-height:16px;display:block}
.ax{display:flex;justify-content:space-between;font-size:20px;line-height:26px;margin-top:6px}
.fc{display:flex;gap:14px}
.fd{flex:1;display:flex;flex-direction:column;align-items:center}
.fd .d{font-size:36px;line-height:1}
.fd .mid{display:flex;gap:14px;align-items:center;margin:14px 0;height:150px}
.rng{width:30px;height:150px;border-radius:15px;background:#404040;position:relative}
.rng i{position:absolute;left:0;right:0;border-radius:15px;min-height:30px}
.hl .h{font-size:54px;line-height:1;color:#fff}
.hl .lo{font-size:34px;color:#FFFF00;line-height:1.2}
.fd .c{font-size:24px;line-height:34px;color:#000;border-radius:17px;width:100%;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---- settings ---- */
var CFG={
  place:'MELBOURNE',
  weather:'weather.forecast_home',            // any HA weather entity
  temp:'sensor.living_room_temperature',      // interior temperature sensor
  humidity:'sensor.living_room_humidity'      // interior humidity sensor
};

/* ---- sample data, used when the page is opened outside Tesserae ---- */
function sample(){
  var now=Date.now(),s=[],i;
  for(i=0;i<96;i++){s.push({last_changed:new Date(now-(96-i)*900e3).toISOString(),state:(18.6+2.2*Math.sin((i-20)/15)).toFixed(2)});}
  var t=[],d=new Date();for(i=0;i<7;i++){var x=new Date(d.getTime()+i*864e5);t.push(x.toISOString().slice(0,10));}
  return {data:{
    ha:{entities:[
      {entity_id:CFG.weather,state:'cloudy',attributes:{temperature:15.8,humidity:67,pressure:1023.9,wind_speed:11.9,wind_bearing:199,uv_index:9.4}},
      {entity_id:CFG.temp,state:'19.6'},
      {entity_id:CFG.humidity,state:'52'}
    ]},
    thist:{samples:s},
    om:{daily:{time:t,weather_code:[51,3,3,95,51,3,55],temperature_2m_max:[16.9,19.5,25.7,25.3,23.6,28.0,26.5],temperature_2m_min:[8.6,11.0,11.7,18.7,15.5,14.9,9.1],precipitation_sum:[0.1,0,0,13.8,0.9,0,6.3]}}
  }};
}
var X=(typeof ctx!=='undefined'&&ctx&&ctx.data&&ctx.data.ha)?ctx:sample();
var D=X.data;

/* ---- helpers ---- */
var M={};((D.ha&&D.ha.entities)||[]).forEach(function(e){M[e.entity_id]=e;});
function st(id){return M[id]?M[id].state:null;}
function at(id,k){return M[id]&&M[id].attributes?M[id].attributes[k]:null;}
function num(v,d){var n=parseFloat(v);return isFinite(n)?n.toFixed(d==null?0:d):'--';}
var C={or:'#FF8000',am:'#FFBF00',pk:'#FF8080',bl:'#FFBFBF',sk:'#8C8CFF',ye:'#FFFF00',wh:'#FFFFFF'};
var DOW=['SUN','MON','TUE','WED','THU','FRI','SAT'];
function hdr(t,code,c1,c2){return '<div class="hd"><div class="hd-t" style="background:'+c1+'">'+t+'</div><div class="hd-f" style="background:'+c2+'"></div><div class="hd-c" style="background:'+c1+'">'+code+'</div></div>';}
function ro(l,v,u,c){return '<div class="ro" style="border-color:'+(c||C.or)+'"><div class="l">'+l+'</div><div class="v">'+v+(u?'<small>'+u+'</small>':'')+'</div></div>';}
function bars(vals,lo,hi,c,last){var h='<div class="bars">';for(var i=0;i<vals.length;i++){var v=vals[i];var p=v==null?0:Math.max(0,Math.min(1,(v-lo)/((hi-lo)||1)));h+='<i style="height:'+Math.round(12+p*88)+'%;background:'+(i===vals.length-1?last:c)+'"></i>';}return h+'</div>';}
/* average a HA history series into n equal buckets over the last `hours`, carrying the last value across gaps */
function buckets(samples,n,hours){var end=Date.now(),start=end-hours*3600e3,step=(end-start)/n,s=[],c=[],i;for(i=0;i<n;i++){s.push(0);c.push(0);}(samples||[]).forEach(function(x){var t=Date.parse(x.last_changed),v=parseFloat(x.state);if(!isFinite(v)||!isFinite(t)||t<start)return;var k=Math.min(n-1,Math.floor((t-start)/step));s[k]+=v;c[k]++;});var out=[],prev=null;for(i=0;i<n;i++){if(c[i]){prev=s[i]/c[i];}out.push(prev);}var first=null;for(i=0;i<n;i++){if(out[i]!=null){first=out[i];break;}}for(i=0;i<n;i++){if(out[i]==null)out[i]=first;}return out;}
/* WMO weather code -> label + colour */
function wx(code){if(code===0)return['CLEAR',C.ye];if(code<3)return['FAIR',C.am];if(code===3)return['CLOUD',C.bl];if(code<50)return['FOG',C.bl];if(code<58)return['DRIZZLE',C.sk];if(code<68)return['RAIN',C.sk];if(code<78)return['SNOW',C.wh];if(code<83)return['SHOWERS',C.sk];return['STORM',C.pk];}

/* ---- environmental ---- */
var W=CFG.weather,H='';
var tb=buckets(D.thist&&D.thist.samples,48,24);
var tv=tb.filter(function(v){return v!=null;});
var tlo=tv.length?Math.min.apply(null,tv):0,thi=tv.length?Math.max.apply(null,tv):1;
H+='<div class="sec">'+hdr('ENVIRONMENTAL',String(st(W)||'').replace(/[_-]/g,' ')+' &middot; '+CFG.place,C.or,C.am);
H+='<div class="env"><div class="hero"><div class="l">INTERIOR TEMPERATURE &middot; DECK 1</div><div class="v">'+num(st(CFG.temp),1)+'<small>&deg;C</small></div></div>';
H+='<div class="grid3">'+ro('EXTERIOR',num(at(W,'temperature'),1),'&deg;C',C.sk)+ro('INT HUMIDITY',num(st(CFG.humidity),0),'%',C.or)+ro('EXT HUMIDITY',num(at(W,'humidity'),0),'%',C.sk)+ro('PRESSURE',num(at(W,'pressure'),0),'HPA',C.bl)+ro('WIND '+num(at(W,'wind_bearing'),0)+'&deg;',num(at(W,'wind_speed'),0),'KM/H',C.bl)+ro('UV INDEX',num(at(W,'uv_index'),1),'',C.pk)+'</div></div>';
H+='<div class="tr"><div class="cap"><span>INTERIOR THERMAL TRACE &middot; 24 H</span><span>LOW <em>'+tlo.toFixed(1)+'&deg;</em> &middot; HIGH <em>'+thi.toFixed(1)+'&deg;</em></span></div>'+bars(tb,tlo,thi,C.or,C.ye)+'<div class="ax"><span>-24 H</span><span>-18 H</span><span>-12 H</span><span>-6 H</span><span>NOW</span></div></div></div>';

/* ---- 7 day forecast ---- */
var dd=(D.om&&D.om.daily)||{},days=dd.time||[];
var mx=dd.temperature_2m_max||[],mn=dd.temperature_2m_min||[];
var wlo=mn.length?Math.min.apply(null,mn):0,whi=mx.length?Math.max.apply(null,mx):1,span=(whi-wlo)||1;
H+='<div class="sec">'+hdr('7 DAY FORECAST','OPEN-METEO',C.sk,C.bl)+'<div class="fc">';
for(var i=0;i<days.length&&i<7;i++){
  var w=wx((dd.weather_code||[])[i]),p=days[i].split('-'),dt=new Date(+p[0],+p[1]-1,+p[2]);
  var tp=(whi-mx[i])/span*100,ht=(mx[i]-mn[i])/span*100,rain=(dd.precipitation_sum||[])[i]||0;
  H+='<div class="fd"><div class="d">'+(i===0?'TODAY':DOW[dt.getDay()]+' '+dt.getDate())+'</div><div class="mid"><div class="rng"><i style="top:'+tp.toFixed(1)+'%;height:'+ht.toFixed(1)+'%;background:'+w[1]+'"></i></div><div class="hl"><div class="h">'+Math.round(mx[i])+'&deg;</div><div class="lo">'+Math.round(mn[i])+'&deg;</div></div></div><div class="c" style="background:'+w[1]+'">'+w[0]+(rain>=1?' '+Math.round(rain)+' MM':'')+'</div></div>';
}
H+='</div></div>';
document.getElementById('app').innerHTML=H;
</script>
</body>
</html>
